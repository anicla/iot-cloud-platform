services:
  mosquitto:
    build: ./mosquitto
    ports:
      - "1883:1883"
    environment:
      - MQTT_SERVER_USERNAME=${MQTT_SERVER_USERNAME:-demo_user}
      - MQTT_SERVER_PASSWORD=${MQTT_SERVER_PASSWORD:-change_me_server_password}
      - MQTT_DEVICE_USERNAME=${MQTT_DEVICE_USERNAME:-demo_device}
      - MQTT_DEVICE_PASSWORD=${MQTT_DEVICE_PASSWORD:-change_me_device_password}
  telemetry_dbservice:
    build: ./microservices/telemetry_microservice/dbService
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fic_data}
      - MYSQL_USER=${MYSQL_USER:-fic_db_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change_me_db_password}
  telemetry_microservice:
    build: ./microservices/telemetry_microservice/logic
    ports:
      - "5001:5001"
    environment:
      - HOST=0.0.0.0
      - PORT=5001
      - DBHOST=telemetry_dbservice
      - DBUSER=${MYSQL_USER:-fic_db_user}
      - DBPASSWORD=${MYSQL_PASSWORD:-change_me_db_password}
      - DBDATABASE=${MYSQL_DATABASE:-fic_data}
      - PYTHONUNBUFFERED=1
    depends_on:
      - telemetry_dbservice
  devices_dbservice:
    build: ./microservices/devices_microservice/dbService
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fic_data}
      - MYSQL_USER=${MYSQL_USER:-fic_db_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change_me_db_password}
  devices_microservice:
    build: ./microservices/devices_microservice/logic
    ports:
      - "5002:5002"
    environment:
      - HOST=0.0.0.0
      - PORT=5002
      - DBHOST=devices_dbservice
      - DBUSER=${MYSQL_USER:-fic_db_user}
      - DBPASSWORD=${MYSQL_PASSWORD:-change_me_db_password}
      - DBDATABASE=${MYSQL_DATABASE:-fic_data}
      - MESSAGE_ROUTER_ADDRESS=message_router
      - MESSAGE_ROUTER_PORT=5000
      - PYTHONUNBUFFERED=1
    depends_on:
      - devices_dbservice
  message_router:
    build: ./message_router
    ports:
      - "5000:5000"
    environment:
      - MQTT_SERVER_ADDRESS=mosquitto
      - MQTT_SERVER_PORT=1883
      - MQTT_USERNAME=${MQTT_SERVER_USERNAME:-demo_user}
      - MQTT_PASSWORD=${MQTT_SERVER_PASSWORD:-change_me_server_password}
      - HOST=0.0.0.0
      - PORT=5000
      - DEVICES_MICROSERVICE_ADDRESS=devices_microservice
      - DEVICES_MICROSERVICE_PORT=5002
      - TELEMETRY_MICROSERVICE_ADDRESS=telemetry_microservice
      - TELEMETRY_MICROSERVICE_PORT=5001
      - PYTHONUNBUFFERED=1
    depends_on:
      - mosquitto
      - devices_microservice
      - telemetry_microservice

networks:
  default:
    name: iot_platform
