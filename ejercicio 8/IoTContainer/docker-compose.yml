services:
  iotcontainer:
    build: .
    image: iotcontainer-image
    environment:
      - MQTT_SERVER_ADDRESS=${MQTT_SERVER_ADDRESS:-localhost}
      - MQTT_SERVER_PORT=${MQTT_SERVER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_DEVICE_USERNAME:-demo_device}
      - MQTT_PASSWORD=${MQTT_DEVICE_PASSWORD:-change_me_device_password}
      - PYTHONUNBUFFERED=1
    volumes:
      - "./code:/etc/usr/src/app"
